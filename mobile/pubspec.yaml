name: nexusvpn
description: NexusVPN mobile client - self-hostable mesh VPN, WireGuard-based, for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.6.0

  # Secure, persistent storage for tokens & device keypair
  flutter_secure_storage: ^10.3.1

  # State management
  provider: ^6.1.5+1

  # Declarative routing + auth redirects
  go_router: ^17.2.3

  # WireGuard tunnel plugin (Android VpnService / iOS NetworkExtension bridge).
  # Native App/Network Extension entitlements still need a real Apple/Google
  # developer account to activate - see README.md "Scope boundary".
  wireguard_flutter: ^0.1.3

  # QR scanning (join network by invite QR) and QR generation (share invite)
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  # Date/number formatting
  intl: ^0.20.3

  # Misc platform helpers
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  uuid: ^4.6.0

  cupertino_icons: ^1.0.9
  multicast_dns: ^0.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  # No assets declaration: nothing in lib/ loads one, and git does not carry
  # an empty directory, so declaring assets/ made a fresh clone fail to build
  # with "unable to find directory entry in pubspec.yaml". Add it back
  # alongside the first real asset.
