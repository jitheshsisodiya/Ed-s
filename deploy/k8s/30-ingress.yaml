apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusvpn
  namespace: nexusvpn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # keep WebSocket/gRPC streams alive
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["app.nexusvpn.example.com", "api.nexusvpn.example.com"]
      secretName: nexusvpn-tls
  rules:
    - host: api.nexusvpn.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8080 } }
    - host: app.nexusvpn.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: admin, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusvpn-grpc
  namespace: nexusvpn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["grpc.nexusvpn.example.com"]
      secretName: nexusvpn-grpc-tls
  rules:
    - host: grpc.nexusvpn.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 9090 } }
