apiVersion: v1
kind: ConfigMap
metadata:
  name: nexusvpn-backend-config
  namespace: nexusvpn
# Keys match backend/internal/config/config.go.
data:
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  METRICS_ADDR: ":9091"
  ACCESS_TOKEN_TTL: "15m"
  REFRESH_TOKEN_TTL: "720h"
  PRESENCE_TTL: "45s"
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexusvpn
  labels: { app: backend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: ghcr.io/jitheshsisodiya/ed-s-backend:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9090 }
            - { name: metrics, containerPort: 9091 }
          envFrom:
            - configMapRef: { name: nexusvpn-backend-config }
            - secretRef: { name: nexusvpn-backend-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nexusvpn
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 9090, targetPort: grpc }
    - { name: metrics, port: 9091, targetPort: metrics }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: nexusvpn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
