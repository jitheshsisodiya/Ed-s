# Copy to 01-secrets.yaml, fill in real values, and DO NOT commit it.
# kubectl apply -f deploy/k8s/01-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: nexusvpn-backend-secrets
  namespace: nexusvpn
type: Opaque
stringData:
  DATABASE_URL: "postgres://nexusvpn:CHANGE_ME@postgres.nexusvpn.svc.cluster.local:5432/nexusvpn?sslmode=require"
  REDIS_ADDR: "redis.nexusvpn.svc.cluster.local:6379"
  JWT_ACCESS_SECRET: "CHANGE_ME_32_BYTES_MIN"
  JWT_REFRESH_SECRET: "CHANGE_ME_32_BYTES_MIN"
  # Must be identical in nexusvpn-relay-secrets below.
  RELAY_SESSION_SECRET: "CHANGE_ME_32_BYTES_MIN"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: nexusvpn-relay-secrets
  namespace: nexusvpn
type: Opaque
stringData:
  # Must match nexusvpn-backend-secrets.RELAY_SESSION_SECRET exactly.
  RELAY_SESSION_SECRET: "CHANGE_ME_32_BYTES_MIN"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexusvpn-postgres-secrets
  namespace: nexusvpn
type: Opaque
stringData:
  POSTGRES_USER: "nexusvpn"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "nexusvpn"
