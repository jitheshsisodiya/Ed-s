# Security response headers, included at every level that sets headers of its
# own (nginx's add_header is not inherited into a block that declares any
# add_header directive, so this file is included explicitly in those blocks).
#
# The Content-Security-Policy matters especially here: the SPA keeps its
# refresh token in localStorage (see src/lib/token-storage.ts for why), which
# is readable by injected script. A strict CSP is the primary defence that
# stops such script from being loaded or from exfiltrating to another origin.

# Only same-origin code may run; the API and the /api/v1/ws WebSocket are
# proxied through this same origin, so 'self' covers them.
# 'unsafe-inline' is limited to styles, which React and the charting library
# inject at runtime; scripts get no inline allowance at all.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Defence in depth against clickjacking for user agents predating CSP's
# frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Stop MIME sniffing turning an uploaded/served file into executable script.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak network IDs or invite codes in the Referer header when a user
# follows a link off-site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The admin panel needs none of these device capabilities.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
