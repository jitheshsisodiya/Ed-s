# Builds the things people actually install, and attaches them to a release.
#
# This exists because handing someone a build over a chat window has a size
# limit, and the universal Android APK is over it. A release is also the only
# form of these artefacts that survives the conversation that produced them:
# a permanent URL, the same file for everyone, next to the tag it was built
# from.
#
# Triggered by a version tag, or by hand from the Actions tab when you want a
# build of whatever is on a branch.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under (e.g. v0.7.0). Created if absent."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # NSIS is what turns the executable into an installer with a Start menu
      # entry and an uninstaller. It is not on the runner by default.
      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer
        working-directory: desktop
        run: wails build -platform windows/amd64 -nsis -ldflags "-X main.Version=${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/build/bin/NexusVPN.exe
            desktop/build/bin/NexusVPN-amd64-installer.exe
          if-no-files-found: error

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The signing key is a repository secret, never a file in the tree:
      # whoever holds it can ship an update Android accepts as this app.
      # Without it the build falls back to the debug key, which installs fine
      # by hand and is refused by Play — so a fork with no secrets still
      # produces something usable rather than failing.
      - name: Install signing key
        # Checked against the secret directly: a step's own env block is not
        # in scope when its if is evaluated, so testing env.KEYSTORE_BASE64
        # here would always be empty and the key never installed.
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: mobile
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Both shapes, because they answer different questions. The per-ABI
      # builds are what somebody downloads onto a phone; the universal one is
      # what you hand to a person whose phone you cannot ask about.
      - name: Build APKs
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Name them recognisably
        working-directory: mobile/build/app/outputs/flutter-apk
        run: |
          mv app-arm64-v8a-release.apk NexusVPN-arm64.apk
          mv app-armeabi-v7a-release.apk NexusVPN-arm32.apk
          mv app-release.apk NexusVPN-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/build/app/outputs/flutter-apk/NexusVPN-*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.apk' \) -exec cp {} out/ \;
          ls -la out

          # Notes are written here rather than pulled from the tag, because
          # the one thing every downloader needs to know is which file is
          # theirs, and a commit message will not say.
          cat > notes.md <<'NOTES'
          ## Which file do I want?

          | File | For |
          |---|---|
          | `NexusVPN-amd64-installer.exe` | Windows. Installs to Program Files with a Start menu entry and an uninstaller. |
          | `NexusVPN.exe` | Windows, no installer. Run it where it sits. |
          | `NexusVPN-arm64.apk` | Any Android phone of the last several years. |
          | `NexusVPN-arm32.apk` | Older 32-bit Android phones. |
          | `NexusVPN-universal.apk` | Every architecture in one file. Larger; use it if you are unsure. |

          Android will ask you to allow "install unknown apps" for whichever
          app opens the file. Windows will warn about an unknown publisher,
          because these builds are unsigned: choose **More info → Run anyway**.
          NOTES

          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NexusVPN $TAG" \
            --notes-file notes.md \
            --verify-tag=false
