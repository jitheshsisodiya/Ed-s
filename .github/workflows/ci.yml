name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  relay:
    name: relay (lint, vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

  client:
    name: client (vet, test, build - all platforms)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: client/go.sum
      - run: go vet ./...
      - name: build (native only, for tests)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./... -race
      - name: cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o /tmp/nexusvpnctl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/nexusvpnctl

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux,   platform: linux/amd64,   tags: "-tags webkit2_41" }
          - { os: windows-latest, name: windows, platform: windows/amd64, tags: "" }
          - { os: macos-latest,   name: macos,   platform: darwin/universal, tags: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Wails needs GTK/WebKit headers to compile the Linux WebView. Ubuntu
      # 24.04 ships webkit2gtk-4.1, which the webkit2_41 build tag selects.
      - name: install linux webview dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: build
        working-directory: desktop
        shell: bash
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.tags }}

      - uses: actions/upload-artifact@v4
        with:
          name: nexusvpn-desktop-${{ matrix.name }}
          path: desktop/build/bin/*
          if-no-files-found: error

  admin:
    name: admin (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: mobile (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  openapi-lint:
    name: validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @redocly/cli lint api/openapi.yaml

  proto-lint:
    name: validate protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint proto
